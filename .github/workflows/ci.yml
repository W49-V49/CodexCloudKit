name: CloudKit acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: cloudkit setup --runtime-root "$RUNNER_TEMP/cloudkit-runtime"
      - run: cloudkit doctor --runtime-root "$RUNNER_TEMP/cloudkit-runtime"
  native-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.23'
          enable-cache: false
      - run: python -m pip install .
      - run: cloudkit setup --profile memory --runtime-root "$RUNNER_TEMP/cloudkit-runtime"
      - run: python scripts/verify_memory.py --runtime-root "$RUNNER_TEMP/cloudkit-runtime" --output "$RUNNER_TEMP/native-memory.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-memory-acceptance
          path: ${{ runner.temp }}/native-memory.json
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Prepare real Redis
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y redis-server
          fi
      - run: python -m pip install .
      - run: cloudkit setup --profile queue --runtime-root "$RUNNER_TEMP/cloudkit-runtime"
      - run: '"$RUNNER_TEMP/cloudkit-runtime/queue/.venv/bin/python" scripts/verify_queue.py --redis-server "$(command -v redis-server)" --output "$RUNNER_TEMP/queue-acceptance.json"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-acceptance
          path: ${{ runner.temp }}/queue-acceptance.json
